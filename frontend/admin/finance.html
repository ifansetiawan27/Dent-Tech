<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance — Admin</title>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=3">
  <script>try{if(localStorage.getItem('sms_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YD7Y9VZQLQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YD7Y9VZQLQ');
</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dent Tech.id">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <main class="min-h-screen pt-6 pb-16 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Finance</h1>
          <p class="text-sm text-slate-500 mt-0.5">Uang masuk &amp; uang keluar secara rinci — terhubung dengan spare part</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="btn-finance-csv" class="btn-secondary" disabled><i data-lucide="sheet" class="w-4 h-4"></i> Download CSV</button>
          <button id="btn-finance-pdf" class="btn-secondary" disabled><i data-lucide="download" class="w-4 h-4"></i> Download PDF</button>
          <button id="btn-expense" class="btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Catat Pengeluaran</button>
        </div>
      </div>

      <!-- Filter periode -->
      <div class="card p-4 mb-4 flex flex-wrap items-end gap-3">
        <div>
          <label class="label">Dari Tanggal</label>
          <input type="date" id="f-from" class="input">
        </div>
        <div>
          <label class="label">Sampai Tanggal</label>
          <input type="date" id="f-to" class="input">
        </div>
        <button id="btn-apply" class="btn-primary"><i data-lucide="filter" class="w-4 h-4"></i> Terapkan</button>
        <button id="btn-reset" class="btn-secondary">Semua Periode</button>
      </div>

      <!-- Ringkasan -->
      <div id="summary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4"></div>

      <!-- Tren bulanan -->
      <div class="card p-5 mb-4">
        <h3 class="font-semibold text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4 text-blue-600"></i> Tren Bulanan</h3>
        <div id="trend"></div>
      </div>

      <!-- Uang masuk & keluar -->
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
        <div class="card p-5">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold text-slate-800 flex items-center gap-2"><i data-lucide="badge-dollar-sign" class="w-4 h-4 text-emerald-600"></i> Aktivitas Pendapatan &amp; Kas Masuk</h3>
            <span id="income-total" class="text-emerald-600 font-bold"></span>
          </div>
          <div id="income-list"></div>
        </div>

        <div class="card p-5">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-slate-800 flex items-center gap-2"><i data-lucide="arrow-up-circle" class="w-4 h-4 text-red-500"></i> Uang Keluar</h3>
            <span id="expense-total" class="text-red-500 font-bold"></span>
          </div>
          <div id="expense-byrev" class="text-xs text-slate-400 mb-3"></div>
          <div id="expense-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { requireAuth } from '/utils/auth.js';
    import { api } from '/services/api.js';
    import { initAdminLayout } from '/components/layout.js';
    import { spinner, emptyState, table, openModal, confirmDialog, toast, refreshIcons } from '/components/ui.js';
    import { fmtIDR, formatIDRInput, parseIDR, bindIDRInput, fmtDate, esc, todayStr } from '/utils/format.js';
    import { downloadFinancePdf, downloadFinanceCsv } from '/utils/finance-doc.js';

    requireAuth(['admin']);
    initAdminLayout('finance');
    lucide.createIcons();

    const $ = (id) => document.getElementById(id);
    let parts = [];
    let financeSnapshot = null;
    let appliedPeriod = { from: '', to: '' };

    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const CAT = {
      SPARE_PART: { label: 'Spare Part', cls: 'bg-blue-50 text-blue-700 ring-blue-200' },
      OPERATIONAL: { label: 'Operasional', cls: 'bg-amber-50 text-amber-700 ring-amber-200' },
      OTHER: { label: 'Lainnya', cls: 'bg-slate-100 text-slate-600 ring-slate-200' }
    };
    function monthLabel(ym) {
      const [y, m] = String(ym).split('-').map(Number);
      return (MONTHS[m - 1] || '') + ' ' + y;
    }
    function queryForPeriod(period) {
      const q = new URLSearchParams();
      if (period.from) q.set('from', period.from);
      if (period.to) q.set('to', period.to);
      const value = q.toString();
      return value ? '?' + value : '';
    }
    function selectedPeriod() { return { from: $('f-from').value, to: $('f-to').value }; }
    function setDownloadEnabled(enabled) {
      $('btn-finance-csv').disabled = !enabled;
      $('btn-finance-pdf').disabled = !enabled;
    }

    async function loadParts() {
      try { const d = await api.get('/api/parts'); parts = d.parts || []; } catch { parts = []; }
    }

    function renderSummary(s) {
      const netCls = s.net >= 0 ? 'text-emerald-600' : 'text-red-500';
      const netIcon = s.net >= 0 ? 'trending-up' : 'trending-down';
      $('summary').innerHTML = `
        <div class="card p-5 border-l-4 border-l-emerald-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Pendapatan Diakui</p>
          <p class="text-2xl font-extrabold text-emerald-600 mt-1">${fmtIDR(s.income)}</p>
          <p class="text-xs text-slate-400 mt-1">Invoice + pemakaian wallet untuk onsite</p>
        </div>
        <div class="card p-5 border-l-4 border-l-cyan-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Total Kas Masuk</p>
          <p class="text-2xl font-extrabold text-cyan-600 mt-1">${fmtIDR(s.total_cash_inflow)}</p>
          <p class="text-xs text-slate-400 mt-1">Pembayaran invoice + top-up wallet</p>
        </div>
        <div class="card p-5 border-l-4 border-l-sky-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Top-up Wallet</p>
          <p class="text-2xl font-extrabold text-sky-600 mt-1">${fmtIDR(s.wallet_topups)}</p>
          <p class="text-xs text-slate-400 mt-1">Kas masuk yang menambah liabilitas</p>
        </div>
        <div class="card p-5 border-l-4 border-l-violet-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Liabilitas Wallet</p>
          <p class="text-2xl font-extrabold text-violet-600 mt-1">${fmtIDR(s.wallet_liability)}</p>
          <p class="text-xs text-slate-400 mt-1">Total saldo wallet pelanggan saat ini</p>
        </div>
        <div class="card p-5 border-l-4 border-l-teal-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Pendapatan Fee Onsite</p>
          <p class="text-2xl font-extrabold text-teal-600 mt-1">${fmtIDR(s.onsite_fee_revenue)}</p>
          <p class="text-xs text-slate-400 mt-1">Pendapatan dari konsumsi saldo wallet</p>
        </div>
        <div class="card p-5 border-l-4 border-l-lime-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Pembayaran Invoice</p>
          <p class="text-2xl font-extrabold text-lime-600 mt-1">${fmtIDR(s.invoice_payments)}</p>
          <p class="text-xs text-slate-400 mt-1">Kas masuk sekaligus pendapatan</p>
        </div>
        <div class="card p-5 border-l-4 border-l-red-400">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Pengeluaran</p>
          <p class="text-2xl font-extrabold text-red-500 mt-1">${fmtIDR(s.expense)}</p>
          <p class="text-xs text-slate-400 mt-1">${s.expense_count} transaksi pengeluaran</p>
        </div>
        <div class="card p-5 border-l-4 border-l-blue-500">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Laba / Rugi Bersih</p>
          <p class="text-2xl font-extrabold ${netCls} mt-1 flex items-center gap-2"><i data-lucide="${netIcon}" class="w-5 h-5"></i>${fmtIDR(s.net)}</p>
          <p class="text-xs text-slate-400 mt-1">Pendapatan diakui − pengeluaran</p>
        </div>`;
      refreshIcons();
    }

    function renderTrend(monthly) {
      const el = $('trend');
      if (!monthly || !monthly.length) {
        el.innerHTML = `<p class="text-sm text-slate-400 py-4 text-center">Belum ada data pada periode ini.</p>`;
        return;
      }
      const maxVal = Math.max(...monthly.map((m) => Math.max(m.income, m.cash_inflow, m.expense)), 1);
      el.innerHTML = `
        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs text-slate-500 mb-3">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> Pendapatan Diakui</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-cyan-500 inline-block"></span> Kas Masuk</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-red-400 inline-block"></span> Pengeluaran</span>
        </div>
        ${monthly.map((m) => `
          <div class="grid grid-cols-[4.5rem_minmax(0,1fr)] sm:grid-cols-[5rem_minmax(0,1fr)_10rem] items-center gap-3 mb-4">
            <span class="text-xs font-medium text-slate-500">${monthLabel(m.month)}</span>
            <div class="space-y-1.5">
              <div class="h-3 bg-emerald-500 rounded-full" style="width:${Math.max((m.income / maxVal) * 100, m.income > 0 ? 2 : 0)}%" title="Pendapatan diakui ${fmtIDR(m.income)}"></div>
              <div class="h-3 bg-cyan-500 rounded-full" style="width:${Math.max((m.cash_inflow / maxVal) * 100, m.cash_inflow > 0 ? 2 : 0)}%" title="Kas masuk ${fmtIDR(m.cash_inflow)}"></div>
              <div class="h-3 bg-red-400 rounded-full" style="width:${Math.max((m.expense / maxVal) * 100, m.expense > 0 ? 2 : 0)}%" title="Pengeluaran ${fmtIDR(m.expense)}"></div>
            </div>
            <div class="col-start-2 sm:col-start-auto text-right text-xs space-y-0.5">
              <div class="text-emerald-600 font-semibold">Pendapatan ${fmtIDR(m.income)}</div>
              <div class="text-cyan-600 font-semibold">Kas ${fmtIDR(m.cash_inflow)}</div>
              <div class="text-red-500 font-semibold">Pengeluaran ${fmtIDR(m.expense)}</div>
            </div>
          </div>`).join('')}`;
    }

    const INCOME_TYPES = {
      INVOICE_PAYMENT: { label: 'Pembayaran Invoice', cls: 'bg-lime-50 text-lime-700 ring-lime-200' },
      WALLET_TOPUP_CASH: { label: 'Top-up Wallet', cls: 'bg-sky-50 text-sky-700 ring-sky-200' },
      ONSITE_FEE_REVENUE: { label: 'Fee Inspeksi Onsite', cls: 'bg-teal-50 text-teal-700 ring-teal-200' }
    };

    function renderIncome(data) {
      $('income-total').textContent = `Pendapatan ${fmtIDR(data.total)}`;
      const list = $('income-list');
      const incomeRows = data.rows || [];
      if (!incomeRows.length) {
        list.innerHTML = emptyState('inbox', 'Belum ada aktivitas pendapatan atau kas masuk', 'Pembayaran invoice, top-up wallet, dan fee onsite akan tampil di sini.');
        refreshIcons();
        return;
      }
      const rows = incomeRows.map((p) => {
        const type = INCOME_TYPES[p.type] || { label: p.type || 'Lainnya', cls: 'bg-slate-100 text-slate-600 ring-slate-200' };
        const treatment = [p.cash_flow ? 'Kas masuk' : '', p.revenue ? 'Pendapatan' : ''].filter(Boolean);
        const reference = p.invoice_number || p.description || p.payment_order_id || p.ticket_id || '-';
        return `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3 whitespace-nowrap text-slate-600">${fmtDate(p.paid_at)}</td>
          <td class="px-4 py-3"><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ${type.cls}">${esc(type.label)}</span></td>
          <td class="px-4 py-3 text-slate-600 max-w-[220px]"><div class="truncate" title="${esc(reference)}">${esc(reference)}</div><div class="text-[11px] text-slate-400">${esc(p.customer_name || '-')}</div></td>
          <td class="px-4 py-3 text-slate-500">${esc(p.method || '-')}</td>
          <td class="px-4 py-3"><div class="flex flex-wrap gap-1">${treatment.map((label) => `<span class="inline-flex px-2 py-0.5 rounded-full text-[11px] font-medium ${label === 'Kas masuk' ? 'bg-cyan-50 text-cyan-700' : 'bg-emerald-50 text-emerald-700'}">${label}</span>`).join('')}</div></td>
          <td class="px-4 py-3 text-right font-semibold ${p.revenue ? 'text-emerald-600' : 'text-cyan-600'} whitespace-nowrap">${p.cash_flow ? '+' : ''}${fmtIDR(p.amount)}</td>
        </tr>`;
      });
      list.innerHTML = table(['Tanggal', 'Jenis', 'Referensi / Customer', 'Metode', 'Perlakuan', 'Jumlah'], rows);
    }

    function renderExpenses(data) {
      $('expense-total').textContent = fmtIDR(data.total);
      const list = $('expense-list');
      if (!data.expenses.length) {
        $('expense-byrev').innerHTML = '';
        list.innerHTML = emptyState('inbox', 'Belum ada pengeluaran', 'Klik "Catat Pengeluaran" untuk menambahkan, misalnya pembelian spare part.');
        refreshIcons();
        return;
      }
      const rows = data.expenses.map((e) => {
        const cat = CAT[e.category] || CAT.OTHER;
        const partInfo = e.part_name ? `${esc(e.part_name)}${e.qty ? ` ×${e.qty}` : ''}` : '-';
        return `
        <tr class="hover:bg-slate-50">
          <td class="px-4 py-3 whitespace-nowrap text-slate-600">${fmtDate(e.expense_date)}</td>
          <td class="px-4 py-3"><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ${cat.cls}">${cat.label}</span></td>
          <td class="px-4 py-3 text-slate-600 max-w-[180px]"><div class="truncate" title="${esc(e.description)}">${esc(e.description) || '-'}</div><div class="text-[11px] text-slate-400">${partInfo !== '-' ? 'Part: ' + partInfo : ''}</div></td>
          <td class="px-4 py-3 text-right font-semibold text-red-500 whitespace-nowrap">-${fmtIDR(e.amount)}</td>
          <td class="px-4 py-3 text-right whitespace-nowrap"><button data-del="${e.id}" class="text-slate-400 hover:text-red-500 p-1 rounded" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
        </tr>`;
      });
      list.innerHTML = table(['Tanggal', 'Kategori', 'Keterangan', 'Jumlah', ''], rows);
      list.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => delExpense(b.dataset.del)));
      refreshIcons();
    }

    function renderByCategory(byCat) {
      const el = $('expense-byrev');
      if (!byCat || !byCat.length) { el.innerHTML = ''; return; }
      el.innerHTML = byCat.map((c) => `<span class="inline-flex items-center gap-1 mr-3">${(CAT[c.category] || CAT.OTHER).label}: <b class="text-slate-600">${fmtIDR(c.total)}</b></span>`).join('');
    }

    async function load() {
      const period = selectedPeriod();
      if (period.from && period.to && period.from > period.to) return toast('Tanggal awal tidak boleh melewati tanggal akhir', 'error');
      financeSnapshot = null;
      setDownloadEnabled(false);
      $('summary').innerHTML = spinner('Menghitung keuangan...');
      $('income-list').innerHTML = '';
      $('expense-list').innerHTML = '';
      try {
        const q = queryForPeriod(period);
        const [summary, income, expenses] = await Promise.all([
          api.get('/api/finance/summary' + q),
          api.get('/api/finance/income' + q),
          api.get('/api/finance/expenses' + q)
        ]);
        financeSnapshot = { summary, income, expenses };
        appliedPeriod = { ...period };
        setDownloadEnabled(true);
        renderSummary(summary);
        renderTrend(summary.monthly);
        renderByCategory(summary.by_category);
        renderIncome(income);
        renderExpenses(expenses);
      } catch (e) {
        $('summary').innerHTML = '';
        $('income-list').innerHTML = emptyState('alert-circle', 'Gagal memuat data', e.message);
        refreshIcons();
      }
    }

    async function downloadFinance(format) {
      if (!financeSnapshot) return toast('Data finance belum selesai dimuat', 'error');
      const button = format === 'pdf' ? $('btn-finance-pdf') : $('btn-finance-csv');
      button.disabled = true;
      try {
        if (format === 'csv') downloadFinanceCsv(financeSnapshot, appliedPeriod);
        else {
          const me = await api.get('/api/auth/me');
          downloadFinancePdf(financeSnapshot, me.settings || {}, appliedPeriod);
        }
      } catch (e) { toast(e.message, 'error'); }
      finally { button.disabled = false; }
    }

    async function delExpense(id) {
      const ok = await confirmDialog({ title: 'Hapus Pengeluaran', message: 'Hapus catatan pengeluaran ini? Jika terkait restock spare part, stok part akan dikurangi kembali.', confirmLabel: 'Hapus', danger: true });
      if (!ok) return;
      try { await api.del('/api/finance/expenses/' + id); toast('Pengeluaran dihapus'); load(); }
      catch (e) { toast(e.message, 'error'); }
    }

    function openExpenseModal() {
      const partOpts = parts.map((p) => `<option value="${p.id}" data-cost="${p.cost || 0}">${esc(p.code)} — ${esc(p.name)} (stok ${p.stock})</option>`).join('');
      const m = openModal({
        title: 'Catat Pengeluaran',
        size: 'lg',
        body: `
          <div class="space-y-4">
            <div>
              <label class="label">Kategori *</label>
              <select id="e-category" class="input">
                <option value="SPARE_PART">Spare Part</option>
                <option value="OPERATIONAL">Operasional</option>
                <option value="OTHER">Lainnya</option>
              </select>
            </div>
            <div id="part-fields" class="space-y-3">
              <div>
                <label class="label">Spare Part</label>
                <select id="e-part" class="input"><option value="">— Pilih part —</option>${partOpts}</select>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="label">Qty</label><input id="e-qty" type="number" min="0" step="any" class="input" value="1"></div>
                <div><label class="label">Harga Beli / unit (Rp)</label><input id="e-unit" type="text" inputmode="numeric" class="input" value="0"></div>
              </div>
              <label class="flex items-center gap-2 text-sm text-slate-600">
                <input id="e-restock" type="checkbox" class="w-4 h-4 accent-blue-600" checked> Tambah stok part (restock)
              </label>
            </div>
            <div>
              <label class="label">Jumlah Pengeluaran (Rp) *</label>
              <input id="e-amount" type="text" inputmode="numeric" class="input" value="0">
            </div>
            <div>
              <label class="label">Keterangan</label>
              <input id="e-desc" class="input" placeholder="cth: Pembelian 5 unit handpiece">
            </div>
            <div>
              <label class="label">Tanggal *</label>
              <input id="e-date" type="date" class="input" value="${todayStr()}">
            </div>
          </div>`,
        footer: `<button class="btn-secondary" data-act="cancel">Batal</button><button class="btn-primary" data-act="save">Simpan</button>`
      });

      const cat = m.el.querySelector('#e-category');
      const partFields = m.el.querySelector('#part-fields');
      const partSel = m.el.querySelector('#e-part');
      const qty = m.el.querySelector('#e-qty');
      const unit = bindIDRInput(m.el.querySelector('#e-unit'));
      const amount = bindIDRInput(m.el.querySelector('#e-amount'));

      function togglePart() { partFields.style.display = cat.value === 'SPARE_PART' ? '' : 'none'; }
      function recompute() {
        if (cat.value === 'SPARE_PART') {
          amount.value = formatIDRInput(Math.round((Number(qty.value) || 0) * parseIDR(unit.value)));
        }
      }
      cat.addEventListener('change', togglePart);
      partSel.addEventListener('change', () => {
        const opt = partSel.selectedOptions[0];
        if (opt && opt.dataset.cost) unit.value = formatIDRInput(opt.dataset.cost);
        recompute();
      });
      qty.addEventListener('input', recompute);
      unit.addEventListener('input', recompute);
      togglePart();

      m.el.querySelector('[data-act="cancel"]').addEventListener('click', () => m.close());
      m.el.querySelector('[data-act="save"]').addEventListener('click', async () => {
        const isPart = cat.value === 'SPARE_PART';
        const body = {
          category: cat.value,
          description: m.el.querySelector('#e-desc').value.trim(),
          amount: parseIDR(amount.value),
          expense_date: m.el.querySelector('#e-date').value || todayStr(),
          part_id: isPart ? (partSel.value || null) : null,
          qty: isPart ? (Number(qty.value) || 0) : 0,
          unit_cost: isPart ? parseIDR(unit.value) : 0,
          restock: isPart ? m.el.querySelector('#e-restock').checked : false
        };
        if (body.amount <= 0) return toast('Jumlah pengeluaran harus lebih dari 0', 'error');
        if (isPart && !body.part_id) return toast('Pilih spare part terlebih dahulu', 'error');
        try {
          await api.post('/api/finance/expenses', body);
          toast('Pengeluaran dicatat');
          m.close();
          load();
        } catch (e) { toast(e.message, 'error'); }
      });
    }

    $('btn-apply').addEventListener('click', load);
    $('btn-reset').addEventListener('click', () => { $('f-from').value = ''; $('f-to').value = ''; load(); });
    $('btn-finance-csv').addEventListener('click', () => downloadFinance('csv'));
    $('btn-finance-pdf').addEventListener('click', () => downloadFinance('pdf'));
    $('btn-expense').addEventListener('click', openExpenseModal);

    (async function init() {
      await loadParts();
      load();
    })();
  </script>
</body>
</html>
