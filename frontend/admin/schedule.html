<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=2">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
  <main class="min-h-screen pt-6 pb-16 px-4 sm:px-6">
    <div class="max-w-5xl mx-auto">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Schedule</h1>
        <p class="text-sm text-slate-500 mt-0.5">Jadwal kunjungan teknisi per tanggal</p>
      </div>
      <div class="card p-4 mb-4 flex flex-wrap items-center gap-3">
        <button id="btn-prev" class="btn-secondary !px-3"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <input id="f-date" type="date" class="input !w-auto flex-1 min-w-[10rem]">
        <button id="btn-next" class="btn-secondary !px-3"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        <button id="btn-today" class="btn-secondary">Hari Ini</button>
      </div>
      <div id="content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { requireAuth } from '/utils/auth.js';
    import { api } from '/services/api.js';
    import { initAdminLayout } from '/components/layout.js';
    import { spinner, errorState, emptyState, statusBadge, refreshIcons, WO_STATUS } from '/components/ui.js';
    import { todayStr, esc } from '/utils/format.js';

    requireAuth(['admin']);
    initAdminLayout('schedule');
    lucide.createIcons();

    const content = document.getElementById('content');
    const dateInput = document.getElementById('f-date');
    dateInput.value = todayStr();

    function shiftDate(days) {
      const d = new Date(dateInput.value + 'T00:00:00');
      d.setDate(d.getDate() + days);
      dateInput.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      load();
    }

    async function load() {
      const date = dateInput.value;
      if (!date) return;
      content.innerHTML = spinner('Memuat jadwal...');
      try {
        const data = await api.get('/api/work-orders?date=' + date);
        const list = data.work_orders;
        const label = new Date(date + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (!list.length) {
          content.innerHTML = `<div class="card">${emptyState('calendar-x', 'Tidak ada jadwal', `Tidak ada work order terjadwal pada ${label}.`)}</div>`;
          refreshIcons();
          return;
        }
        content.innerHTML = `
          <p class="text-sm font-medium text-slate-500 mb-3">${label} · ${list.length} pekerjaan</p>
          <div class="space-y-3">
            ${list.map((w) => `
              <a href="/admin/workorder-detail.html?id=${w.id}" class="card p-4 flex items-center gap-4 hover:border-blue-300 transition-colors">
                <div class="w-14 text-center shrink-0">
                  <p class="text-xs text-slate-400">${esc(w.time_window ? w.time_window.split(' - ')[0] : '-')}</p>
                  <div class="h-1 rounded bg-blue-100 my-1.5"><div class="h-1 rounded bg-blue-500 w-2/3"></div></div>
                  <p class="text-xs text-slate-400">${esc(w.time_window ? w.time_window.split(' - ')[1] || '' : '')}</p>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <p class="font-semibold text-slate-700">${esc(w.customer_name)}</p>
                    ${statusBadge(w.status, WO_STATUS)}
                  </div>
                  <p class="text-sm text-slate-500 truncate mt-0.5">${esc(w.problem)}</p>
                  <p class="text-xs text-slate-400 mt-1"><i data-lucide="hard-hat" class="w-3 h-3 inline -mt-0.5"></i> ${esc(w.technician_name || 'Belum ditugaskan')} · ${w.number}</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 shrink-0"></i>
              </a>`).join('')}
          </div>`;
        refreshIcons();
      } catch (e) {
        content.innerHTML = errorState(e.message);
        refreshIcons();
      }
    }

    document.getElementById('btn-prev').addEventListener('click', () => shiftDate(-1));
    document.getElementById('btn-next').addEventListener('click', () => shiftDate(1));
    document.getElementById('btn-today').addEventListener('click', () => { dateInput.value = todayStr(); load(); });
    dateInput.addEventListener('change', load);
    load();
  </script>
</body>
</html>
