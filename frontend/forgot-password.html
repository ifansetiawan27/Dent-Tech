<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Dent Tech.id</title>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=3">
  <script>try{if(localStorage.getItem('sms_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans antialiased">
  <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-2.5 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-slate-100" type="button" aria-label="Ganti tema"></button>
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md fade-up">
      <div class="flex items-center gap-3 mb-8 justify-center">
        <img src="/assets/logo.png?v=2" alt="Logo" class="w-10 h-10 object-contain">
        <div>
          <p class="font-extrabold text-slate-800 leading-tight" id="brand-name">Dent Tech.id</p>
          <p class="text-slate-400 text-xs">Service Management System</p>
        </div>
      </div>

      <div class="card p-8 shadow-sm">
        <h2 class="text-xl font-bold text-slate-800">Lupa password?</h2>
        <p class="text-sm text-slate-500 mt-1">Masukkan email terdaftar. Kami akan mengirim tautan untuk mengatur ulang password Anda.</p>

        <div id="fp-success" class="hidden mt-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl px-4 py-3 flex items-start gap-2">
          <i data-lucide="check-circle" class="w-4 h-4 mt-0.5 shrink-0"></i><span id="fp-success-msg"></span>
        </div>
        <div id="fp-error" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 flex items-start gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i><span id="fp-error-msg"></span>
        </div>

        <form id="fp-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="label" for="fp-email">Email</label>
            <input class="input" type="email" id="fp-email" placeholder="nama@perusahaan.com" autocomplete="username" required>
          </div>
          <button type="submit" id="fp-btn" class="btn-primary w-full !py-3">
            <span id="fp-btn-label">Kirim Tautan Reset</span>
          </button>
        </form>

        <p class="text-sm text-slate-500 text-center mt-6"><a href="/login.html" class="font-semibold text-blue-600 hover:underline">Kembali ke Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { api } from '/services/api.js';
    import { bindThemeToggle } from '/utils/theme.js';

    lucide.createIcons();
    bindThemeToggle(document.getElementById('theme-toggle'));

    (async () => {
      try {
        const { settings } = await api.get('/api/public/settings');
        if (settings.company_name) {
          document.getElementById('brand-name').textContent = settings.company_name;
          document.title = `Lupa Password — ${settings.company_name}`;
        }
      } catch {}
    })();

    const errBox = document.getElementById('fp-error');
    const errMsg = document.getElementById('fp-error-msg');
    const okBox = document.getElementById('fp-success');
    const okMsg = document.getElementById('fp-success-msg');
    const btn = document.getElementById('fp-btn');
    const btnLabel = document.getElementById('fp-btn-label');

    document.getElementById('fp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      okBox.classList.add('hidden');
      const email = document.getElementById('fp-email').value.trim();
      if (!email) {
        errMsg.textContent = 'Email wajib diisi';
        errBox.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btnLabel.textContent = 'Mengirim...';
      try {
        const res = await api.post('/api/auth/forgot-password', { email });
        okMsg.textContent = res.message || 'Jika email terdaftar, tautan reset password telah dikirim.';
        okBox.classList.remove('hidden');
        e.target.reset();
      } catch (err) {
        errMsg.textContent = err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnLabel.textContent = 'Kirim Tautan Reset';
      }
    });
  </script>
</body>
</html>
