<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Dent Tech.id</title>
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/app.css">
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased flex items-center justify-center px-6">
  <main class="w-full max-w-md text-center">
    <div class="mx-auto w-20 h-20 rounded-2xl bg-white border border-slate-200 shadow-sm flex items-center justify-center">
      <img src="/assets/logo.png?v=2" alt="Dent Tech.id" class="w-12 h-12 object-contain">
    </div>
    <h1 class="mt-6 text-2xl font-bold text-slate-800">Anda sedang offline</h1>
    <p class="mt-2 text-sm text-slate-500 leading-relaxed">
      Koneksi internet tidak tersedia. Periksa jaringan Anda lalu coba lagi.
      Beberapa halaman yang pernah dibuka mungkin masih dapat diakses.
    </p>
    <button id="retry" class="btn-primary mt-6 w-full" type="button">Coba Lagi</button>
    <a href="/" class="mt-3 inline-block text-sm font-medium text-blue-600 hover:underline">Kembali ke Beranda</a>

    <div id="cached-links" class="hidden mt-8 text-left">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Terakhir dibuka</p>
      <ul id="cached-list" class="mt-2 space-y-1"></ul>
    </div>
  </main>

  <script>
    document.getElementById('retry').addEventListener('click', () => window.location.reload());

    try {
      const pages = JSON.parse(localStorage.getItem('pwa_last_pages') || '[]');
      if (Array.isArray(pages) && pages.length) {
        const list = document.getElementById('cached-list');
        pages.slice(0, 5).forEach((p) => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = p.url;
          a.textContent = p.title || p.url;
          a.className = 'block truncate rounded-lg px-3 py-2 text-sm text-slate-600 bg-white border border-slate-200 hover:bg-slate-50';
          li.appendChild(a);
          list.appendChild(li);
        });
        document.getElementById('cached-links').classList.remove('hidden');
      }
    } catch (e) { /* ignore */ }

    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
