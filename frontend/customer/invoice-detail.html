<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Invoice — Customer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=2">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <main class="min-h-screen pt-5 pb-16 px-4">
    <div class="max-w-2xl mx-auto">
      <a href="/customer/invoices.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 mb-3"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</a>
      <div id="content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { requireAuth } from '/utils/auth.js';
    import { api } from '/services/api.js';
    import { initMobileLayout } from '/components/layout.js';
    import { spinner, errorState, statusBadge, openModal, confirmDialog, toast, refreshIcons, INVOICE_STATUS } from '/components/ui.js';
    import { fmtIDR, fmtDate, fmtDateTime, esc } from '/utils/format.js';
    import { downloadInvoice } from '/utils/invoice-doc.js';

    requireAuth(['customer']);
    initMobileLayout('invoices', 'customer');
    lucide.createIcons();

    const content = document.getElementById('content');
    const invId = new URLSearchParams(location.search).get('id');
    let data = null;
    let revision = null;
    let polling = false;

    async function load(silent = false) {
      if (!silent) content.innerHTML = spinner('Memuat invoice...');
      if (polling) return;
      polling = true;
      try {
        if (silent) {
          const rev = await api.get('/api/invoices/' + invId + '?revision=1');
          const nextRevision = `${rev.invoice.version || 0}:${rev.invoice.updated_at || ''}:${rev.invoice.status}`;
          if (nextRevision === revision || document.querySelector('[data-modal-backdrop]')) return;
        }
        const fresh = await api.get('/api/invoices/' + invId);
        data = fresh;
        revision = `${fresh.invoice.version || 0}:${fresh.invoice.updated_at || ''}:${fresh.invoice.status}`;
        render();
      } catch (e) {
        if (!silent) {
          content.innerHTML = errorState(e.message);
          refreshIcons();
        }
      } finally {
        polling = false;
      }
    }

    function render() {
      const { invoice: inv, totals, items, customer, payments, ticket, payment_account: pa } = data;
      const bankPanel = (inv.status !== 'PAID' && pa && (pa.bank_name || pa.bank_account_name || pa.bank_account_number)) ? `
          <div class="px-6 py-4 bg-blue-50/60 border-t border-blue-100">
            <p class="text-xs uppercase tracking-wide text-blue-700 font-bold mb-1">Rekening Pembayaran</p>
            <p class="text-xs text-slate-400 mb-2">Silakan transfer ke rekening berikut:</p>
            <div class="space-y-1 text-sm">
              ${pa.bank_name ? `<p><span class="text-slate-400 inline-block w-24">Nama Bank</span><b class="text-slate-700">${esc(pa.bank_name)}</b></p>` : ''}
              ${pa.bank_account_number ? `<p><span class="text-slate-400 inline-block w-24">No. Rekening</span><b class="text-slate-700">${esc(pa.bank_account_number)}</b></p>` : ''}
              ${pa.bank_account_name ? `<p><span class="text-slate-400 inline-block w-24">Atas Nama</span><b class="text-slate-700">${esc(pa.bank_account_name)}</b></p>` : ''}
            </div>
          </div>` : '';
      content.innerHTML = `
        <div class="card overflow-hidden mb-4">
          <div class="bg-slate-900 text-white px-6 py-5 flex items-start justify-between gap-3">
            <div>
               <p class="text-xs uppercase tracking-widest text-slate-400">${inv.type === 'PROFORMA' ? 'Proforma Invoice' : 'Invoice'}</p>
               <p class="text-lg font-bold">${inv.number}</p>
               <p id="sync-status" class="text-[10px] text-slate-500 mt-1">Sinkron otomatis aktif</p>
              <p class="text-xs text-slate-400 mt-0.5">${esc(customer?.name || '')}</p>
            </div>
            ${statusBadge(inv.status, INVOICE_STATUS)}
          </div>
          <div class="px-6 py-4 text-sm space-y-1 border-b border-slate-100">
            <p class="text-slate-500">Diterbitkan: <b class="text-slate-700">${fmtDate(inv.issued_at)}</b></p>
            <p class="text-slate-500">Jatuh tempo: <b class="text-slate-700">${inv.due_at ? fmtDate(inv.due_at) : '-'}</b></p>
            ${ticket ? `<p class="text-slate-500">Ref: <b class="text-slate-700">${ticket.number}</b></p>` : ''}
          </div>
          <div class="px-6 py-4">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead><tr class="text-left text-xs uppercase tracking-wide text-slate-400 border-b border-slate-200"><th class="py-2 pr-3">Deskripsi</th><th class="py-2 pr-3 text-center">Qty</th><th class="py-2 pr-3 text-right">Harga</th><th class="py-2 text-right">Jumlah</th></tr></thead>
                <tbody class="divide-y divide-slate-100">${items.map((it) => `
                  <tr>
                    <td class="py-3 pr-3 text-slate-600">${esc(it.description)}${it.item_type === 'CUSTOM' ? '<span class="ml-1.5 text-[9px] uppercase font-semibold text-violet-600 bg-violet-50 rounded px-1 py-0.5">Tambahan</span>' : ''}</td>
                    <td class="py-3 pr-3 text-center text-slate-500">${it.qty} ${esc(it.unit || '')}</td>
                    <td class="py-3 pr-3 text-right text-slate-500">${fmtIDR(it.unit_price)}</td>
                    <td class="py-3 text-right font-medium text-slate-700">${fmtIDR(it.qty * it.unit_price)}</td>
                  </tr>`).join('')}</tbody>
              </table>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-100 space-y-2 text-sm">
              ${totals.discount > 0 ? `<div class="flex justify-between text-slate-500"><span>Diskon</span><span>-${fmtIDR(totals.discount)}</span></div>` : ''}
              <div class="flex justify-between text-slate-500"><span>PPN ${totals.tax_rate}%</span><span>${fmtIDR(totals.tax)}</span></div>
              <div class="flex justify-between font-bold text-slate-800 text-base pt-2 border-t border-slate-100"><span>Total</span><span>${fmtIDR(totals.total)}</span></div>
            </div>
          </div>
          ${bankPanel}
          ${payments.length ? `
          <div class="px-6 py-4 bg-emerald-50/60 border-t border-emerald-100">
            <p class="text-xs uppercase tracking-wide text-emerald-700 font-bold mb-1.5">Pembayaran</p>
            ${payments.map((p) => `<p class="text-sm text-slate-600">${fmtIDR(p.amount)} via ${esc(p.method)}${p.reference ? ' (' + esc(p.reference) + ')' : ''} · ${fmtDateTime(p.paid_at)}</p>`).join('')}
          </div>` : ''}
        </div>

        <div class="space-y-3">
          <button id="btn-download" class="btn-secondary w-full !py-3.5"><i data-lucide="download" class="w-4 h-4"></i> Download Invoice (PDF)</button>
          ${inv.status !== 'PAID' ? `
          <button id="btn-pay" class="btn-primary w-full !py-3.5"><i data-lucide="credit-card" class="w-4 h-4"></i> Konfirmasi Pembayaran</button>
          <p class="text-xs text-slate-400 text-center">Konfirmasi akan langsung mencatat invoice sebagai sudah dibayar.</p>` : `
          <div class="card p-4 border-2 border-emerald-200 flex items-center gap-3">
            <i data-lucide="check-circle" class="w-6 h-6 text-emerald-500 shrink-0"></i>
            <p class="text-sm text-slate-600">Invoice ini sudah dibayar. Terima kasih!</p>
          </div>`}
        </div>`;
      refreshIcons();

      const btnDownload = document.getElementById('btn-download');
      if (btnDownload) btnDownload.addEventListener('click', async () => {
        let company = {};
        try {
          const [fresh, me] = await Promise.all([api.get('/api/invoices/' + invId), api.get('/api/auth/me')]);
          data = fresh;
          revision = `${fresh.invoice.version || 0}:${fresh.invoice.updated_at || ''}:${fresh.invoice.status}`;
          company = me.settings || {};
        } catch {}
        downloadInvoice({ ...data, company });
      });

      const btnPay = document.getElementById('btn-pay');
      if (btnPay) btnPay.addEventListener('click', () => {
        const m = openModal({
          title: 'Konfirmasi Pembayaran',
          size: 'sm',
          body: `
            <p class="text-sm text-slate-600 mb-4">Total yang dibayar: <b>${fmtIDR(totals.total)}</b></p>
            <div class="space-y-4">
              <div><label class="label">Metode Pembayaran</label>
                <select id="cp-method" class="input"><option>TRANSFER</option><option>CASH</option><option>QRIS</option></select>
              </div>
              <div><label class="label">Nomor Referensi</label><input id="cp-ref" class="input" placeholder="cth: TRF-BCA-12345"></div>
            </div>`,
          footer: `<button class="btn-secondary" data-modal-close>Batal</button><button id="cp-submit" class="btn-primary">Konfirmasi</button>`
        });
        m.el.querySelector('#cp-submit').addEventListener('click', async () => {
          try {
            await api.post(`/api/invoices/${inv.id}/pay`, { method: m.el.querySelector('#cp-method').value, reference: m.el.querySelector('#cp-ref').value.trim() });
            m.close();
            toast('Pembayaran berhasil dicatat');
            load();
          } catch (e) { toast(e.message, 'error'); }
        });
      });
    }

    let pollTimer = null;
    if (invId) {
      load();
      pollTimer = setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 10000);
      window.addEventListener('focus', () => load(true));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
      window.addEventListener('pagehide', () => { if (pollTimer) clearInterval(pollTimer); });
    } else content.innerHTML = errorState('Invoice ID tidak ditemukan');
  </script>
</body>
</html>
