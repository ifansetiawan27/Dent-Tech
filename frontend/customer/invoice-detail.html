<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Invoice — Customer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=3">
  <script>try{if(localStorage.getItem('sms_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YD7Y9VZQLQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YD7Y9VZQLQ');
</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dent Tech.id">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <main class="min-h-screen pt-5 pb-16 px-4">
    <div class="max-w-2xl mx-auto">
      <a href="/customer/invoices.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 mb-3"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</a>
      <div id="content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { requireAuth } from '/utils/auth.js';
    import { api } from '/services/api.js';
    import { initMobileLayout } from '/components/layout.js';
    import { spinner, errorState, statusBadge, toast, refreshIcons, INVOICE_STATUS } from '/components/ui.js';
    import { fmtIDR, fmtDate, fmtDateTime, esc } from '/utils/format.js';
    import { downloadInvoice } from '/utils/invoice-doc.js';

    requireAuth(['customer']);
    initMobileLayout('invoices', 'customer');
    lucide.createIcons();

    const content = document.getElementById('content');
    const invId = new URLSearchParams(location.search).get('id');
    let data = null;
    let revision = null;
    let polling = false;
    let paymentPollTimer = null;

    function safeQrSrc(value) {
      const src = String(value || '');
      return /^data:image\/(?:png|jpeg|webp|svg\+xml);base64,[a-z0-9+/=]+$/i.test(src) ? src : '';
    }

    function paymentOrderHtml(order) {
      if (!order) return '';
      const qr = safeQrSrc(order.qr_data_url);
      const status = String(order.status || 'PENDING').toUpperCase();
      return `<section id="payment-order" class="card p-5 mb-4 border-2 ${status === 'COMPLETED' ? 'border-emerald-300 bg-emerald-50' : 'border-blue-200'}" aria-live="polite">
        <div class="flex items-start justify-between gap-3">
          <div><p class="font-bold text-slate-800">Pembayaran QRIS Pakasir</p><p class="text-xs text-slate-500 mt-0.5">Order ID: <span class="font-mono">${esc(order.order_id || '-')}</span></p></div>
          <span class="text-xs font-bold rounded-full px-2.5 py-1 ${status === 'COMPLETED' ? 'bg-emerald-100 text-emerald-700' : status === 'PENDING' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'}">${esc(status)}</span>
        </div>
        ${status === 'PENDING' && qr ? `<img src="${esc(qr)}" alt="Kode QRIS pembayaran invoice" class="w-64 max-w-full aspect-square object-contain mx-auto my-4 rounded-xl border border-slate-200 bg-white p-2">` : ''}
        <dl class="text-sm space-y-2 mt-3">
          <div class="flex justify-between gap-3 border-t border-slate-200 pt-2"><dt class="font-bold">Total pembayaran</dt><dd class="font-bold text-blue-700">${fmtIDR(order.amount)}</dd></div>
          <div class="flex justify-between gap-3"><dt class="text-slate-500">Berlaku sampai</dt><dd class="text-right">${order.expired_at ? fmtDateTime(order.expired_at) : '-'}</dd></div>
        </dl>
        <p class="text-xs text-slate-500 mt-4">Pembayaran diverifikasi otomatis. Tidak perlu mengirim bukti atau mengonfirmasi manual.</p>
      </section>`;
    }

    async function pollPayment(orderId) {
      if (paymentPollTimer) clearTimeout(paymentPollTimer);
      try {
        const result = await api.get(`/api/invoices/${invId}/payment-orders/${encodeURIComponent(orderId)}`);
        if (result.order?.status === 'COMPLETED') {
          toast('Pembayaran QRIS telah terverifikasi');
          await load();
          return;
        }
        if (result.order && ['PENDING'].includes(String(result.order.status).toUpperCase())) {
          data.payment_options = { ...(data.payment_options || {}), pakasir_qris: result.order };
          render();
          paymentPollTimer = setTimeout(() => pollPayment(orderId), 4000);
          return;
        }
        data.payment_options = { ...(data.payment_options || {}), pakasir_qris: result.order };
        render();
      } catch (e) {
        toast(e.message, 'error');
        paymentPollTimer = setTimeout(() => pollPayment(orderId), 6000);
      }
    }

    async function load(silent = false) {
      if (!silent) content.innerHTML = spinner('Memuat invoice...');
      if (polling) return;
      polling = true;
      try {
        if (silent) {
          const rev = await api.get('/api/invoices/' + invId + '?revision=1');
          const nextRevision = `${rev.invoice.version || 0}:${rev.invoice.updated_at || ''}:${rev.invoice.status}`;
          if (nextRevision === revision || document.querySelector('[data-modal-backdrop]')) return;
        }
        const fresh = await api.get('/api/invoices/' + invId);
        data = fresh;
        revision = `${fresh.invoice.version || 0}:${fresh.invoice.updated_at || ''}:${fresh.invoice.status}`;
        render();
      } catch (e) {
        if (!silent) {
          content.innerHTML = errorState(e.message);
          refreshIcons();
        }
      } finally {
        polling = false;
      }
    }

    function render() {
      const { invoice: inv, totals, items, customer, payments, ticket } = data;
      const pa = data.payment_options?.bank || data.payment_account;
      const paymentOrder = data.payment_options?.pakasir_qris;
      const quotationApproved = inv.type !== 'PROFORMA' || inv.approval_status === 'APPROVED';
      const repairComplete = !data.work_order || data.work_order.status === 'APPROVED';
      const paymentAvailable = inv.status !== 'PAID' && quotationApproved && repairComplete;
      const bankPanel = (paymentAvailable && pa && (pa.bank_name || pa.bank_account_name || pa.bank_account_number)) ? `
          <div class="px-6 py-4 bg-blue-50/60 border-t border-blue-100">
             <p class="text-xs uppercase tracking-wide text-blue-700 font-bold mb-1">Transfer Bank</p>
             <p class="text-xs text-slate-500 mb-2">Alternatif pembayaran melalui rekening yang dikonfigurasi admin:</p>
            <div class="space-y-1 text-sm">
              ${pa.bank_name ? `<p><span class="text-slate-400 inline-block w-24">Nama Bank</span><b class="text-slate-700">${esc(pa.bank_name)}</b></p>` : ''}
              ${pa.bank_account_number ? `<p><span class="text-slate-400 inline-block w-24">No. Rekening</span><b class="text-slate-700">${esc(pa.bank_account_number)}</b></p>` : ''}
              ${pa.bank_account_name ? `<p><span class="text-slate-400 inline-block w-24">Atas Nama</span><b class="text-slate-700">${esc(pa.bank_account_name)}</b></p>` : ''}
            </div>
          </div>` : '';
      content.innerHTML = `
        <div class="card overflow-hidden mb-4">
          <div class="bg-slate-900 text-white px-6 py-5 flex items-start justify-between gap-3">
            <div>
               <p class="text-xs uppercase tracking-widest text-slate-400">${inv.type === 'PROFORMA' ? 'Proforma Invoice' : 'Invoice'}</p>
               <p class="text-lg font-bold">${inv.number}</p>
               <p id="sync-status" class="text-[10px] text-slate-500 mt-1">Sinkron otomatis aktif</p>
              <p class="text-xs text-slate-400 mt-0.5">${esc(customer?.name || '')}</p>
            </div>
            ${statusBadge(inv.status, INVOICE_STATUS)}
          </div>
          <div class="px-6 py-4 text-sm space-y-1 border-b border-slate-100">
            <p class="text-slate-500">Diterbitkan: <b class="text-slate-700">${fmtDate(inv.issued_at)}</b></p>
            <p class="text-slate-500">Jatuh tempo: <b class="text-slate-700">${inv.due_at ? fmtDate(inv.due_at) : '-'}</b></p>
            ${ticket ? `<p class="text-slate-500">Ref: <b class="text-slate-700">${ticket.number}</b></p>` : ''}
          </div>
          <div class="px-6 py-4">
            <div class="overflow-x-auto">
              <table class="min-w-full text-sm">
                <thead><tr class="text-left text-xs uppercase tracking-wide text-slate-400 border-b border-slate-200"><th class="py-2 pr-3">Deskripsi</th><th class="py-2 pr-3 text-center">Qty</th><th class="py-2 pr-3 text-right">Harga</th><th class="py-2 text-right">Jumlah</th></tr></thead>
                <tbody class="divide-y divide-slate-100">${items.map((it) => `
                  <tr>
                    <td class="py-3 pr-3 text-slate-600">${esc(it.description)}${it.item_type === 'CUSTOM' ? '<span class="ml-1.5 text-[9px] uppercase font-semibold text-violet-600 bg-violet-50 rounded px-1 py-0.5">Tambahan</span>' : ''}</td>
                    <td class="py-3 pr-3 text-center text-slate-500">${it.qty} ${esc(it.unit || '')}</td>
                    <td class="py-3 pr-3 text-right text-slate-500">${fmtIDR(it.unit_price)}</td>
                    <td class="py-3 text-right font-medium text-slate-700">${fmtIDR(it.qty * it.unit_price)}</td>
                  </tr>`).join('')}</tbody>
              </table>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-100 space-y-2 text-sm">
              ${totals.discount > 0 ? `<div class="flex justify-between text-slate-500"><span>Diskon</span><span>-${fmtIDR(totals.discount)}</span></div>` : ''}
              <div class="flex justify-between text-slate-500"><span>PPN ${totals.tax_rate}%</span><span>${fmtIDR(totals.tax)}</span></div>
              <div class="flex justify-between font-bold text-slate-800 text-base pt-2 border-t border-slate-100"><span>Total</span><span>${fmtIDR(totals.total)}</span></div>
            </div>
          </div>
          ${inv.type === 'PROFORMA' && inv.approval_status === 'SENT' ? `
          <div class="px-6 py-4 bg-violet-50 border-t border-violet-100">
            <p class="font-semibold text-violet-800">Persetujuan Biaya Perbaikan</p>
            <p class="text-sm text-violet-700 mt-1">Periksa rincian di atas. Setelah disetujui, teknisi dapat memulai perbaikan dan nominal tidak dapat diubah.</p>
            <button id="btn-approve-quote" class="btn-primary w-full mt-3"><i data-lucide="check-circle" class="w-4 h-4"></i> Setujui Proforma</button>
          </div>` : ''}
          ${inv.type === 'PROFORMA' && inv.approval_status === 'APPROVED' && !repairComplete ? `
          <div class="px-6 py-4 bg-amber-50 border-t border-amber-100 text-sm text-amber-800">Proforma telah disetujui. Pembayaran tersedia segera setelah teknisi menyelesaikan pekerjaan dan mengirim laporan.</div>` : ''}
          ${bankPanel}
          ${payments.length ? `
          <div class="px-6 py-4 bg-emerald-50/60 border-t border-emerald-100">
            <p class="text-xs uppercase tracking-wide text-emerald-700 font-bold mb-1.5">Pembayaran</p>
            ${payments.map((p) => `<p class="text-sm text-slate-600">${fmtIDR(p.amount)} via ${esc(p.method)}${p.reference ? ' (' + esc(p.reference) + ')' : ''} · ${fmtDateTime(p.paid_at)}</p>`).join('')}
          </div>` : ''}
        </div>

        ${paymentAvailable && paymentOrder ? paymentOrderHtml(paymentOrder) : ''}
        <div class="space-y-3">
          <button id="btn-download" class="btn-secondary w-full !py-3.5"><i data-lucide="download" class="w-4 h-4"></i> Download Invoice (PDF)</button>
          ${paymentAvailable ? `
          <button id="btn-pay" class="btn-primary w-full !py-3.5"><i data-lucide="qr-code" class="w-4 h-4"></i> ${paymentOrder?.status === 'PENDING' ? 'Tampilkan QRIS' : 'Bayar dengan QRIS'}</button>
          <p class="text-xs text-slate-400 text-center">Status pembayaran diperiksa dan diverifikasi otomatis oleh Pakasir.</p>` : inv.status === 'PAID' ? `
          <div class="card p-4 border-2 border-emerald-200 flex items-center gap-3">
            <i data-lucide="check-circle" class="w-6 h-6 text-emerald-500 shrink-0"></i>
            <p class="text-sm text-slate-600">Invoice ini sudah dibayar. Terima kasih!</p>
          </div>` : ''}
        </div>`;
      refreshIcons();

      const btnApproveQuote = document.getElementById('btn-approve-quote');
      if (btnApproveQuote) btnApproveQuote.addEventListener('click', async () => {
        btnApproveQuote.disabled = true;
        try {
          await api.post(`/api/invoices/${inv.id}/approve`);
          toast('Proforma disetujui. Teknisi telah diberi notifikasi.');
          load();
        } catch (e) { toast(e.message, 'error'); btnApproveQuote.disabled = false; }
      });

      const btnDownload = document.getElementById('btn-download');
      if (btnDownload) btnDownload.addEventListener('click', async () => {
        let company = {};
        try {
          const [fresh, me] = await Promise.all([api.get('/api/invoices/' + invId), api.get('/api/auth/me')]);
          data = fresh;
          revision = `${fresh.invoice.version || 0}:${fresh.invoice.updated_at || ''}:${fresh.invoice.status}`;
          company = me.settings || {};
        } catch {}
        downloadInvoice({ ...data, company });
      });

      const btnPay = document.getElementById('btn-pay');
      if (btnPay) btnPay.addEventListener('click', async () => {
        btnPay.disabled = true;
        try {
          const result = await api.post(`/api/invoices/${inv.id}/payment-orders`);
          data.payment_options = { ...(data.payment_options || {}), pakasir_qris: result.order };
          render();
          document.getElementById('payment-order')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (result.order?.status === 'PENDING') pollPayment(result.order.id);
        } catch (e) {
          toast(e.message, 'error');
          btnPay.disabled = false;
        }
      });

      if (paymentAvailable && paymentOrder?.status === 'PENDING' && paymentOrder.id && !paymentPollTimer) {
        paymentPollTimer = setTimeout(() => pollPayment(paymentOrder.id), 4000);
      }
    }

    let pollTimer = null;
    if (invId) {
      load();
      pollTimer = setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 10000);
      window.addEventListener('focus', () => load(true));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
      window.addEventListener('pagehide', () => {
        if (pollTimer) clearInterval(pollTimer);
        if (paymentPollTimer) clearTimeout(paymentPollTimer);
      });
    } else content.innerHTML = errorState('Invoice ID tidak ditemukan');
  </script>
</body>
</html>
