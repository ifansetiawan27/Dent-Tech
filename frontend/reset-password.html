<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Dent Tech.id</title>
  <link rel="icon" type="image/png" href="/assets/logo.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=3">
  <script>try{if(localStorage.getItem('sms_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YD7Y9VZQLQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YD7Y9VZQLQ');
</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans antialiased">
  <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-2.5 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-slate-100" type="button" aria-label="Ganti tema"></button>
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md fade-up">
      <div class="flex items-center gap-3 mb-8 justify-center">
        <img src="/assets/logo.png?v=2" alt="Logo" class="w-10 h-10 object-contain">
        <div>
          <p class="font-extrabold text-slate-800 leading-tight" id="brand-name">Dent Tech.id</p>
          <p class="text-slate-400 text-xs">Service Management System</p>
        </div>
      </div>

      <div class="card p-8 shadow-sm">
        <h2 class="text-xl font-bold text-slate-800">Atur ulang password</h2>
        <p class="text-sm text-slate-500 mt-1">Masukkan password baru untuk akun Anda.</p>

        <div id="rp-loading" class="mt-6 flex flex-col items-center gap-3">
          <div class="w-8 h-8 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-sm text-slate-500">Memverifikasi tautan...</p>
        </div>

        <div id="rp-invalid" class="hidden mt-4">
          <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3">
            Tautan reset tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru.
          </div>
          <a href="/forgot-password.html" class="btn-primary w-full mt-4 inline-block text-center">Minta Tautan Baru</a>
        </div>

        <div id="rp-form-wrap" class="hidden">
          <div id="rp-error" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 flex items-start gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 shrink-0"></i><span id="rp-error-msg"></span>
          </div>
          <div id="rp-success" class="hidden mt-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl px-4 py-3">
            Password berhasil diubah. Mengarahkan ke halaman login...
          </div>
          <form id="rp-form" class="mt-6 space-y-4" novalidate>
            <div>
              <label class="label" for="rp-new">Password Baru</label>
              <input class="input" type="password" id="rp-new" placeholder="min. 6 karakter" autocomplete="new-password" required>
            </div>
            <div>
              <label class="label" for="rp-confirm">Ulangi Password Baru</label>
              <input class="input" type="password" id="rp-confirm" placeholder="ulangi password baru" autocomplete="new-password" required>
            </div>
            <button type="submit" id="rp-btn" class="btn-primary w-full !py-3">
              <span id="rp-btn-label">Simpan Password Baru</span>
            </button>
          </form>
        </div>

        <p class="text-sm text-slate-500 text-center mt-6"><a href="/login.html" class="font-semibold text-blue-600 hover:underline">Kembali ke Login</a></p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { api } from '/services/api.js';
    import { bindThemeToggle } from '/utils/theme.js';

    lucide.createIcons();
    bindThemeToggle(document.getElementById('theme-toggle'));

    (async () => {
      try {
        const { settings } = await api.get('/api/public/settings');
        if (settings.company_name) {
          document.getElementById('brand-name').textContent = settings.company_name;
          document.title = `Reset Password — ${settings.company_name}`;
        }
      } catch {}
    })();

    const loading = document.getElementById('rp-loading');
    const invalid = document.getElementById('rp-invalid');
    const formWrap = document.getElementById('rp-form-wrap');
    const errBox = document.getElementById('rp-error');
    const errMsg = document.getElementById('rp-error-msg');
    const okBox = document.getElementById('rp-success');
    const btn = document.getElementById('rp-btn');
    const btnLabel = document.getElementById('rp-btn-label');

    function parseFragment(hash) {
      const params = new URLSearchParams(String(hash || '').replace(/^#/, ''));
      const out = {};
      params.forEach((value, key) => { out[key] = value; });
      return out;
    }

    const fragment = parseFragment(window.location.hash);
    const query = new URLSearchParams(window.location.search);
    if (window.location.hash) history.replaceState(null, '', window.location.pathname);

    let accessToken = fragment.access_token;
    const hasError = fragment.error || query.get('error');

    // Bila tidak ada token di hash, bisa jadi proyek memakai alur PKCE
    // (lossless redirect menyimpan code di query). SDK di bawah menukarnya.
    async function resolveAccessToken() {
      if (accessToken) return accessToken;
      const cfg = await api.get('/api/auth/providers');
      if (!cfg || !cfg.supabase_url) return null;
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      const supabase = createClient(cfg.supabase_url, cfg.supabase_anon_key, {
        auth: { flowType: 'pkce', detectSessionInUrl: true }
      });
      const { data } = await supabase.auth.getSession();
      return data?.session?.access_token || null;
    }

    (async () => {
      const token = await resolveAccessToken();
      if (!token || hasError) {
        loading.classList.add('hidden');
        invalid.classList.remove('hidden');
      } else {
        accessToken = token;
        loading.classList.add('hidden');
        formWrap.classList.remove('hidden');
        lucide.createIcons();
      }
    })();

    document.getElementById('rp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      const next = document.getElementById('rp-new').value;
      const confirm = document.getElementById('rp-confirm').value;
      if (!next) {
        errMsg.textContent = 'Password baru wajib diisi';
        errBox.classList.remove('hidden');
        return;
      }
      if (next.length < 6) {
        errMsg.textContent = 'Password baru minimal 6 karakter';
        errBox.classList.remove('hidden');
        return;
      }
      if (next !== confirm) {
        errMsg.textContent = 'Konfirmasi password tidak sama';
        errBox.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btnLabel.textContent = 'Menyimpan...';
      try {
        await api.post('/api/auth/reset-password', { access_token: accessToken, new_password: next });
        e.target.reset();
        formWrap.classList.add('hidden');
        okBox.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/login.html'; }, 1800);
      } catch (err) {
        errMsg.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btnLabel.textContent = 'Simpan Password Baru';
      }
    });
  </script>
</body>
</html>
