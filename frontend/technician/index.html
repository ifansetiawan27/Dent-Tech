<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda — Technician</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } } };</script>
  <link rel="stylesheet" href="/styles/app.css?v=2">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <main class="min-h-screen pt-5 pb-16 px-4">
    <div class="max-w-2xl mx-auto">
      <div class="mb-5">
        <h1 class="text-xl font-bold text-slate-800" id="greeting">Halo</h1>
        <p class="text-sm text-slate-500" id="date-label"></p>
      </div>
      <div id="content"></div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { requireAuth, getUser } from '/utils/auth.js';
    import { api } from '/services/api.js';
    import { initMobileLayout } from '/components/layout.js';
    import { spinner, errorState, emptyState, statusBadge, refreshIcons, WO_STATUS, PRIORITY } from '/components/ui.js';
    import { esc, fmtDate } from '/utils/format.js';

    requireAuth(['technician']);
    initMobileLayout('home', 'technician');
    lucide.createIcons();

    const user = getUser();
    document.getElementById('greeting').textContent = 'Halo, ' + user.name.split(' ')[0];
    document.getElementById('date-label').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    const content = document.getElementById('content');
    content.innerHTML = spinner('Memuat pekerjaan...');

    function jobCard(j) {
      return `
        <a href="/technician/job-detail.html?id=${j.id}" class="card p-4 block hover:border-blue-300 transition-colors fade-up">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-slate-400">${j.number}</span>
            <div class="flex gap-1.5">${statusBadge(j.priority, PRIORITY)}${statusBadge(j.status, WO_STATUS)}</div>
          </div>
          <p class="font-semibold text-slate-800 mt-2">${esc(j.problem)}</p>
          <p class="text-sm text-slate-500 mt-1">${esc(j.service_type || '')} · ${esc(j.equipment_name || '')}</p>
          <div class="mt-3 pt-3 border-t border-slate-100 flex items-center gap-4 text-xs text-slate-500">
            <span class="flex items-center gap-1"><i data-lucide="building-2" class="w-3.5 h-3.5"></i> ${esc(j.customer_name)}</span>
            <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${esc(j.time_window || '-')}</span>
          </div>
        </a>`;
    }

    try {
      const d = await api.get('/api/dashboard');
      const today = d.today_jobs;
      const upcoming = d.upcoming_jobs;
      content.innerHTML = `
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="card p-4 text-center"><p class="text-2xl font-bold text-blue-600">${d.stats.active}</p><p class="text-xs text-slate-400 mt-0.5">Job Aktif</p></div>
          <div class="card p-4 text-center"><p class="text-2xl font-bold text-emerald-600">${d.stats.completed_month}</p><p class="text-xs text-slate-400 mt-0.5">Selesai Bulan Ini</p></div>
          <div class="card p-4 text-center"><p class="text-2xl font-bold text-slate-700">${d.stats.completed_total}</p><p class="text-xs text-slate-400 mt-0.5">Total Selesai</p></div>
        </div>

        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400 mb-3">Job Hari Ini</h2>
        ${today.length ? `<div class="space-y-3 mb-6">${today.map(jobCard).join('')}</div>` : `<div class="card mb-6">${emptyState('calendar-check', 'Tidak ada job hari ini', 'Semua jadwal hari ini selesai atau belum ada.')}</div>`}

        <h2 class="text-sm font-bold uppercase tracking-wide text-slate-400 mb-3">Akan Datang</h2>
        ${upcoming.length ? `<div class="space-y-3">${upcoming.map((j) => `
          <a href="/technician/job-detail.html?id=${j.id}" class="card p-4 flex items-center gap-3 hover:border-blue-300 transition-colors">
            <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex flex-col items-center justify-center shrink-0">
              <span class="text-sm font-bold leading-none">${new Date(j.scheduled_date + 'T00:00:00').getDate()}</span>
              <span class="text-[9px] uppercase">${new Date(j.scheduled_date + 'T00:00:00').toLocaleDateString('id-ID', { month: 'short' })}</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-slate-700 truncate">${esc(j.problem)}</p>
              <p class="text-xs text-slate-400 mt-0.5">${esc(j.customer_name)} · ${esc(j.time_window || '-')}</p>
            </div>
            ${statusBadge(j.status, WO_STATUS)}
          </a>`).join('')}</div>` : `<div class="card">${emptyState('calendar', 'Belum ada jadwal', 'Job mendatang akan tampil di sini.')}</div>`}`;
      refreshIcons();
    } catch (e) {
      content.innerHTML = errorState(e.message);
      refreshIcons();
    }
  </script>
</body>
</html>
